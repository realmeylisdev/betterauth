name: betterauth_flutter
description: Flutter bindings, secure storage, social sign-in and Bloc integration for betterauth_dart.
version: 0.2.0
repository: https://github.com/realmeylisdev/betterauth
homepage: https://github.com/realmeylisdev/betterauth/tree/main/packages/betterauth_flutter
issue_tracker: https://github.com/realmeylisdev/betterauth/issues
topics:
  - authentication
  - auth
  - flutter
  - client
  - sdk

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  app_links: ^6.3.2
  betterauth_dart: ^0.2.0
  dio: ^5.7.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_secure_storage: ^9.2.0
  flutter_web_auth_2: ^4.1.0
  google_sign_in: ^6.2.1
  meta: ^1.15.0
  passkeys: ^2.19.0
  sign_in_with_apple: ^6.1.3

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.2
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0
