name: publish betterauth_flutter

# Tag-triggered publishing to pub.dev via GitHub OIDC (no tokens). Enable
# "Automated publishing from GitHub Actions" on the betterauth_flutter pub.dev
# admin page with tag pattern `betterauth_flutter-v{{version}}`, then push a tag
# like `betterauth_flutter-v0.2.0`. Publish this ONLY AFTER betterauth_dart is
# live on pub.dev (it depends on `betterauth_dart: ^0.2.0`).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "betterauth_flutter-v*"

permissions:
  id-token: write # required for OIDC authentication to pub.dev
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.1"

      - name: Resolve workspace
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed packages/betterauth_flutter

      - name: Analyze
        run: flutter analyze packages/betterauth_flutter

      - name: Test
        working-directory: packages/betterauth_flutter
        run: flutter test

      - name: Publish
        working-directory: packages/betterauth_flutter
        run: dart pub publish --force
